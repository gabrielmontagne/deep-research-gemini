[project]
name = "deep-research-gemini"
version = "0.1.0"
description = "MCP server for Gemini Deep Research Agent"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
deep-research-gemini = "deep_research_gemini.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_gemini"]
